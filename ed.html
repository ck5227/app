<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="急診主訴鑑別參考：最符合／最常見、最嚴重不能漏、其他鑑別三組並列，每條建議可追溯原始出處。">
<title>急診主訴導航</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b3c50'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='%235ee0c0'/%3E%3C/svg%3E">
<style>
/* 白底為預設；深色僅在使用者以 ◐ 切換時啟用 */
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --panel-2:#F6F9FA; --line:#E1E9ED; --line-2:#CBD8DE;
  --ink:#143340; --muted:#5D717D; --navy:#0B3C50; --navy-2:#15566B;
  --teal:#007D78; --teal-ink:#00645F; --mint:#E6F6F1;
  --red:#AE3040; --red-bg:#FDF1F2; --amber:#8A5E12; --amber-bg:#FFF7E3; --blue-bg:#EEF5F9; --blue:#225970;
  --shadow:0 1px 2px rgba(11,60,80,.05),0 6px 18px rgba(11,60,80,.06);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0B151B; --panel:#122029; --panel-2:#172A35; --line:#25404D; --line-2:#335565;
  --ink:#DCE9EE; --muted:#8FA8B3; --navy:#0A2633; --navy-2:#123847;
  --teal:#4FD1B8; --teal-ink:#7FE3CF; --mint:#123A36;
  --red:#F07A84; --red-bg:#3A1A20; --amber:#F2C46B; --amber-bg:#352A12; --blue-bg:#16303D; --blue:#9CCBE0;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15.5px/1.6 system-ui,-apple-system,"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* ---------- 頂部 ---------- */
header{background:var(--navy);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.logo{width:36px;height:36px;border-radius:9px;background:#176073;color:#70E8C9;display:grid;place-items:center;font-size:22px;font-weight:700}
.brand strong{display:block;font-size:19px;letter-spacing:.5px;line-height:1.2}
.brand small{display:block;font-size:11px;letter-spacing:1.6px;color:#A5D8DD}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:10px}
.tabs button{border:0;background:transparent;color:#CFE6EC;padding:6px 16px;border-radius:7px;font-size:15px}
.tabs button[aria-selected="true"]{background:#fff;color:var(--navy);font-weight:700}
:root[data-theme="dark"] .tabs button[aria-selected="true"]{background:var(--teal);color:#06231F}
/* 白底時，鑑別三組以淡色底區分，不靠灰背景 */
.bucket.b1{background:linear-gradient(180deg,var(--mint) 0,var(--panel) 120px)}
.bucket.b2{background:linear-gradient(180deg,var(--red-bg) 0,var(--panel) 120px)}
:root[data-theme="dark"] .bucket.b1,:root[data-theme="dark"] .bucket.b2{background:var(--panel)}
.derived{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-2)}
.derived span{font-size:13px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.derived b{font-variant-numeric:tabular-nums;color:var(--navy)}
:root[data-theme="dark"] .derived b{color:var(--teal-ink)}
.pill.adm{background:var(--red-bg);color:var(--red)}
.pill.home{background:var(--mint);color:var(--teal-ink)}
.pill.cond{background:var(--amber-bg);color:var(--amber)}
.dsec{border-radius:10px;padding:10px 13px;margin-top:10px;font-size:14px}
.dsec h3{margin:0 0 4px;font-size:13.5px}
.dsec ul{margin:0;padding-left:18px}
.dsec li{margin:3px 0}
.dsec.adm{background:var(--red-bg)} .dsec.adm h3{color:var(--red)}
.dsec.home{background:var(--mint)} .dsec.home h3{color:var(--teal-ink)}
.dsec.cond{background:var(--amber-bg)} .dsec.cond h3{color:var(--amber)}
.hbtn{background:transparent;border:1px solid #6F93A2;color:#E3F1F5;border-radius:8px;padding:6px 12px;font-size:13.5px;text-decoration:none}
.hbtn:hover{border-color:#fff}
.notice{background:var(--amber-bg);color:var(--amber);font-size:13px;padding:7px 24px}

/* ---------- 版面 ---------- */
.layout{max-width:1440px;margin:18px auto 40px;padding:0 20px;display:grid;gap:18px;grid-template-columns:minmax(0,1fr) 330px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.work>*+*{margin-top:14px}
aside{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
aside>*+*{margin-top:14px}
.eyebrow{font-size:11.5px;letter-spacing:1.6px;color:var(--teal);font-weight:700;text-transform:uppercase}
h1{font-size:23px;line-height:1.35;margin:4px 0 4px}
h2{font-size:16px;margin:0 0 10px}
.muted{color:var(--muted);font-size:13.5px}

/* 病人列 */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.strip label{font-size:12.5px;color:var(--muted);display:block}
.strip input,.strip select{display:block;width:100%;margin-top:3px;border:1px solid var(--line-2);border-radius:8px;
  padding:7px 9px;background:var(--panel-2);min-width:0}
.strip .bad input{border-color:var(--red);background:var(--red-bg)}

/* 核心輸入 */
.core{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grp h3{font-size:13.5px;margin:0 0 8px;color:var(--teal-ink);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.grp h3 small{color:var(--muted);font-weight:400;font-size:12px}
.grp.gated{opacity:.45}
.grp.gated .row{pointer-events:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row .lab{flex:1 1 auto;min-width:0}
.row .hint{display:block;font-size:12px;color:var(--amber)}
.seg{display:inline-flex;flex-shrink:0;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line-2);background:var(--panel);padding:4px 11px;font-size:13px;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff;font-weight:700}
.seg button.unk[aria-pressed="true"]{background:var(--line-2);color:var(--ink)}
.row select,.row input{border:1px solid var(--line-2);border-radius:8px;padding:5px 8px;background:var(--panel-2);max-width:62%}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.grid9 button{min-height:52px;border:1px solid var(--line-2);border-radius:9px;background:var(--panel);font-size:14px}
.grid9 button:hover{border-color:var(--teal)}
.grid9 button[aria-pressed="true"]{background:var(--mint);border-color:var(--teal);color:var(--teal-ink);font-weight:700}

/* 警示 */
.alert{border-radius:12px;padding:12px 16px;font-size:14px;border-left:4px solid var(--red);background:var(--red-bg)}
.alert strong{color:var(--red)}
.alert ul{margin:6px 0 0;padding-left:18px}
.alert li{margin:3px 0}
.alert.calm{border-color:var(--blue);background:var(--blue-bg)}
.alert.calm strong{color:var(--blue)}

/* 三組 */
.buckets{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr))}
.bucket{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);border-top:4px solid var(--teal)}
.bucket.b2{border-top-color:var(--red)}
.bucket.b3{border-top-color:var(--line-2)}
.bucket>header{all:unset;display:block;margin-bottom:8px}
.bucket h2{margin:0;display:flex;align-items:center;gap:8px;font-size:16px}
.bucket .num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--mint);color:var(--teal-ink)}
.bucket.b2 .num{background:var(--red-bg);color:var(--red)}
.bucket.b3 .num{background:var(--panel-2);color:var(--muted)}
.bucket .q{font-size:12.5px;color:var(--muted);margin:2px 0 0}
.card{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:8px;background:var(--panel);cursor:pointer;text-align:left;width:100%;display:block}
.card:hover{border-color:var(--teal)}
.card.hit{box-shadow:inset 3px 0 var(--teal)}
.b2 .card.hit{box-shadow:inset 3px 0 var(--red)}
.card .t{font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;gap:8px}
.card .meta{display:flex;gap:10px;font-size:12px;margin-top:3px;font-variant-numeric:tabular-nums}
.s{color:var(--teal-ink)} .a{color:var(--red)} .m{color:var(--amber)}
.card .why1{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--panel-2);color:var(--muted);font-weight:500;white-space:nowrap}
.pill.common{background:var(--blue-bg);color:var(--blue)}
.pill.fit{background:var(--mint);color:var(--teal-ink)}
.pill.tag{background:var(--amber-bg);color:var(--amber)}
.empty{font-size:13px;color:var(--muted);padding:10px 2px}
details.more3 summary{cursor:pointer;list-style:none}
details.more3 summary::-webkit-details-marker{display:none}

/* 抽屜 */
.scrim{position:fixed;inset:0;background:rgba(5,20,28,.45);z-index:30;opacity:0;pointer-events:none;transition:.18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--panel);z-index:31;
  transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer.on{transform:none}
.dhead{padding:16px 18px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:19px;margin:4px 0 6px}
.dclose{float:right;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:4px 10px}
.dtabs{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.dtabs button{border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.dtabs button[aria-selected="true"]{background:var(--mint);border-color:var(--teal);color:var(--teal-ink);font-weight:700}
.tagrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tagrow button{border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.tagrow button[aria-pressed="true"]{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);font-weight:700}
.dbody{padding:14px 18px 30px;overflow:auto;flex:1}
.item{padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item b{display:block;font-size:14.5px}
.item p{margin:3px 0;font-size:13.5px;color:var(--muted)}
.item .cav{color:var(--amber)}
.yield{font-size:11px;border-radius:999px;padding:1px 8px;margin-left:6px;font-weight:500}
.y-high{background:var(--mint);color:var(--teal-ink)} .y-mid{background:var(--blue-bg);color:var(--blue)} .y-low{background:var(--red-bg);color:var(--red)}
.lst{list-style:none;padding:0;margin:4px 0 10px}
.lst li{position:relative;padding:3px 0 3px 16px;font-size:14px}
.lst li::before{content:'';position:absolute;left:3px;top:11px;width:6px;height:6px;border-radius:50%}
.lst.s li::before{background:var(--teal)} .lst.a li::before{background:var(--red)} .lst.m li::before{background:var(--amber)}
.why{border:1px solid var(--line-2);background:transparent;color:var(--teal-ink);border-radius:6px;padding:1px 8px;font-size:12px;margin-top:4px}
.src{border-left:2px solid var(--teal);padding:6px 0 6px 11px;margin-top:6px;font-size:12.8px}
.src .meta{color:var(--muted);font-size:12px}
.src a{color:var(--teal-ink)}
.locked{border-left:2px solid var(--red);padding:5px 0 5px 10px;margin-top:6px;font-size:12.5px;color:var(--red)}
.callout{border-radius:10px;padding:10px 13px;font-size:13.5px;background:var(--amber-bg);color:var(--amber);margin-top:10px}

/* 側欄 */
aside details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
aside summary{cursor:pointer;font-weight:700;font-size:14.5px}
aside .grp{margin-top:12px}
.integ{font-size:13px}
.integ b{font-variant-numeric:tabular-nums}
.integ .bar{height:6px;border-radius:3px;background:var(--red-bg);overflow:hidden;margin:6px 0}
.integ .bar i{display:block;height:100%;background:var(--teal)}
.linkbtn{border:0;background:none;color:var(--teal-ink);padding:0;text-decoration:underline;text-underline-offset:3px;font-size:13px}
table.audit{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
table.audit td,table.audit th{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left;vertical-align:top}
footer{max-width:1440px;margin:0 auto 30px;padding:0 20px;font-size:12px;color:var(--muted)}
footer a{color:var(--teal-ink)}

/* ---------- 響應式 ---------- */
@media (max-width:1180px){ .buckets{grid-template-columns:1fr 1fr} .bucket.b3{grid-column:1/-1} }
@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:0 14px}
  aside{position:static;max-height:none}
  .buckets{grid-template-columns:1fr}
  header{padding:10px 14px;gap:10px}
  .brand small{display:none}
  .tabs{order:3;width:100%;justify-content:space-between;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:1 0 auto;padding:7px 10px;white-space:nowrap}
  .notice{padding:7px 14px}
  h1{font-size:20px}
}
@media (max-width:420px){ .strip{grid-template-columns:repeat(3,1fr)} .hbtn.flow{display:none} }
#buckets{scroll-margin-top:84px}
@media (max-width:900px){ #buckets{scroll-margin-top:132px} }
.jump{display:none}
@media (max-width:900px){
  .jump{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;
    background:var(--navy);color:#fff;border:0;border-radius:12px;padding:11px 14px;gap:12px;align-items:center;
    box-shadow:0 6px 20px rgba(5,20,28,.3);font-size:14px}
  .jump b{font-variant-numeric:tabular-nums}
  .jump .r{color:#FFB3BA}
  .jump .go{margin-left:auto;font-weight:700}
  .jump.off{display:none}
  body{padding-bottom:76px}
}
@media print{ header,.notice,aside,.drawer,.scrim,footer{display:none!important} .layout{display:block} body{background:#fff} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">+</span>
    <div><strong>急診主訴導航</strong><small>ED CHIEF COMPLAINT NAVIGATOR</small></div></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <a class="hbtn flow" href="dizzy.html" id="flowlink" hidden>頭暈流程圖</a>
  <button class="hbtn" id="theme" title="切換深色／淺色">◐</button>
  <button class="hbtn" id="reset">清除本次</button>
</header>
<div class="notice">臨床參考原型・未經專科審核　不取代床邊評估；不提供自動醫囑。資料僅存在本頁，重新整理即清除；請勿輸入姓名或病歷號。</div>

<div class="layout">
  <main class="work">
    <section>
      <div class="eyebrow" id="ceyebrow"></div>
      <h1 id="ctitle"></h1>
      <p class="muted" id="cprimer" style="margin:0"></p>
    </section>
    <div id="alerts"></div>
    <section class="panel"><div class="strip" id="strip"></div><div class="derived" id="derived" hidden></div></section>
    <section class="panel"><div class="core" id="core"></div></section>
    <section class="buckets" id="buckets" aria-live="polite"></section>
  </main>

  <aside>
    <details id="moredet" open>
      <summary>更多病人資料</summary>
      <div id="more"></div>
    </details>
    <div class="panel integ" id="integ"></div>
  </aside>
</div>

<footer>
  三組並非互斥：同一診斷可同時「最符合」與「最嚴重」。「最常見」僅在資料不足時補位，並標示其盛行率出處。
  不顯示診斷機率。所有建議只能引用已人工查證之文獻，未查證者自動封鎖。
  <a href="./">回首頁</a>
</footer>

<button class="jump" id="jump" type="button"></button>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="診斷詳情"></aside>

<script src="ddx-data.js?v=20261006e"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STRIP=['age','sex','preg','sbp','dbp','hr','rr','temp','spo2'];
const CORE={dizzy:['發作型態','伴隨症狀','HINTS'],abdo:[],fever:['宿主狀態','定位線索']};
const SHORT={acid:'酸中毒'};
let KEY='abdo', C=null, F={}, DER={}, TAG={}, OPEN=null, DTAB='why';
// 計算值（陰離子隙、滲透壓間隙、CURB-65 等）與輸入值合併後供判讀使用
const facts=()=>Object.assign({},F,DER);
function derive(){ try{ DER=C.derive?C.derive(F):{}; }catch(e){ DER={}; } }

/* ---------- 引用 ---------- */
const refOK=id=>!!(REFS[id]&&REFS[id].verified);
const refsOK=ids=>!!(ids&&ids.length&&ids.every(refOK));
function srcHTML(ids){
  return ids.map(id=>{
    const r=REFS[id];
    if(!r||!r.verified) return `<div class="locked">引用 ${esc(id)} 尚未通過人工查證，已封鎖。</div>`;
    return `<div class="src"><b>${r.t}</b>
      <div class="meta">${r.src}${r.yr?'　'+r.yr:''}${r.sec&&r.sec!=='—'?'　'+r.sec:''}　·　${r.strength}　·　查證 ${r.verified}</div>
      <div style="margin-top:3px">${r.key}</div>
      ${r.limit?`<div class="meta" style="margin-top:3px">適用限制：${r.limit}</div>`:''}
      ${r.url?`<div class="meta"><a href="${r.url}" target="_blank" rel="noopener noreferrer">原始連結 ↗</a></div>`:''}</div>`;
  }).join('');
}
const whyBtn=ids=>`<button class="why" data-refs="${ids.join(',')}">依據</button>`;
function bindWhy(root){
  root.querySelectorAll('.why').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const nx=b.nextElementSibling;
    if(nx&&nx.classList.contains('srcbox')){nx.remove();return;}
    const d=document.createElement('div');d.className='srcbox';d.innerHTML=srcHTML(b.dataset.refs.split(','));
    b.after(d);
  });
}
function auditAll(){
  const rows=[];
  const add=(path,ids)=>(ids&&ids.length?ids:['（無引用）']).forEach(id=>rows.push({path,id,ok:refOK(id)}));
  for(const c of Object.values(COMPLAINTS)){
    (c.redflags||[]).forEach((r,i)=>add(`${c.name}／紅旗 ${i+1}`,r.refs));
    (c.dx||[]).forEach(d=>{
      if(d.common) add(`${c.name}／${d.name}／常見度`,[d.common.ref]);
      if(d.dispo) add(`${c.name}／${d.name}／動向`,d.dispo.refs);
      (d.ask||[]).forEach(a=>add(`${c.name}／${d.name}／追問`,a.refs));
      (d.tests||[]).forEach(t=>add(`${c.name}／${d.name}／${t.t}`,t.refs));
    });
  }
  return rows;
}

/* ---------- 判讀 ---------- */
const val=id=>(id in F)?F[id]:((id in DER)&&DER[id]!==undefined?DER[id]:null);
function testRule(r){
  const v=val(r.f);
  if(v===null||v===undefined) return 'missing';
  if('any' in r) return r.any.includes(v)?'hit':'no';
  if('want' in r) return v===r.want?'hit':'no';
  if('gte' in r) return (typeof v==='number'&&v>=r.gte)?'hit':'no';
  if('lte' in r) return (typeof v==='number'&&v<=r.lte)?'hit':'no';
  return 'no';
}
function evalDx(d){
  // weak：位置、年齡等人口學線索，顯示為支持但不計入「最符合」門檻
  const support=[],missing=[],against=[];let decisive=false,strong=0;
  (d.rules||[]).forEach(r=>{const t=testRule(r);
    if(t==='hit'){support.push(r.s);if(r.decisive)decisive=true;if(!r.weak)strong++;}
    else if(t==='missing')missing.push(r.s);});
  (d.against||[]).forEach(r=>{if(testRule(r)==='hit')against.push(r.s);});
  return {support,missing,against,decisive,strong};
}
const visible=d=>{try{return !d.showIf||d.showIf(facts());}catch(e){return true;}};
const primary=d=>val('site')!==null&&!!d.primary&&d.primary.includes(val('site'));
const regionOK=d=>!d.regions||val('site')===null||d.regions.includes(val('site'));
function buckets(){
  const all=(C.dx||[]).filter(visible).map(d=>({d,e:evalDx(d)}));
  // primary：該位置應優先排除之診斷（如右下腹痛之闌尾炎），在各組一律排第一
  const fit=all.filter(x=>(x.e.strong>=2||x.e.decisive)&&!x.e.against.length)
               .sort((a,b)=>(primary(b.d)-primary(a.d))||(b.e.decisive-a.e.decisive)||(b.e.support.length-a.e.support.length));
  fit.forEach(x=>x.kind='fit');
  const A=[...fit];
  // 資料不足時以「最常見」補位，且常見度本身須有已查證之出處
  // 排序：位置優先排除者 → 已有資料支持者 → 與所選位置明確相符者 → 全體盛行率
  const site=val('site'), explicit=d=>site!==null&&!!d.regions&&d.regions.includes(site);
  all.filter(x=>x.d.common&&refOK(x.d.common.ref)&&!x.e.against.length&&regionOK(x.d)&&!A.includes(x))
     .sort((a,b)=>(primary(b.d)-primary(a.d))||(b.e.support.length-a.e.support.length)||(explicit(b.d)-explicit(a.d))||(a.d.common.rank-b.d.common.rank))
     .forEach(x=>{ if(A.length<3){ A.push({...x,kind:'common'}); } });
  const B=all.filter(x=>x.d.danger)
             .sort((a,b)=>(primary(b.d)-primary(a.d))||(b.e.decisive-a.e.decisive)||(b.e.support.length-a.e.support.length));
  const inA=new Set(A.map(x=>x.d.id));
  const Cc=all.filter(x=>!x.d.danger&&!inA.has(x.d.id))
              .sort((a,b)=>(regionOK(b.d)-regionOK(a.d))||(b.e.support.length-a.e.support.length));
  return [A,B,Cc];
}

/* ---------- 欄位 ---------- */
function fieldsOf(c){const o=[];(c.groups||[]).forEach(g=>g.fields.forEach(f=>o.push([g,f])));return o;}
function isCore(g){return g.core||(CORE[KEY]||[]).some(p=>g.g.startsWith(p));}
function shown(f){try{return !f.showIf||f.showIf(facts());}catch(e){return true;}}

function inputHTML(f,compact){
  const v=val(f.id);
  if(f.type==='tri'){
    return `<span class="seg" data-tri="${f.id}" role="group" aria-label="${esc(f.label)}">
      <button type="button" data-v="true" aria-pressed="${v===true}">是</button>
      <button type="button" data-v="false" aria-pressed="${v===false}">否</button>
      <button type="button" class="unk" data-v="null" aria-pressed="${v===null}">未知</button></span>`;
  }
  if(f.type==='choice'){
    if(compact||f.opts.length>3) return `<select data-f="${f.id}" aria-label="${esc(f.label)}"><option value="">未知</option>${
      f.opts.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
    return `<span class="seg" data-choice="${f.id}">${f.opts.map(o=>
      `<button type="button" data-v="${esc(o)}" aria-pressed="${v===o}">${o}</button>`).join('')}
      <button type="button" class="unk" data-v="" aria-pressed="${v===null}">未知</button></span>`;
  }
  if(f.type==='num') return `<input type="number" inputmode="decimal" data-f="${f.id}" data-num="1" step="${f.step||1}"
      value="${v===null?'':v}" placeholder="未知" aria-label="${esc(f.label)}">`;
  return `<input type="text" data-f="${f.id}" value="${v===null?'':esc(v)}" placeholder="${esc(f.ph||'未知')}" aria-label="${esc(f.label)}">`;
}
function groupHTML(g){
  const fs=g.fields.filter(f=>!STRIP.includes(f.id)&&shown(f));
  if(!fs.length) return '';
  let gated=false; try{gated=g.gate?!g.gate(facts()):false;}catch(e){}
  return `<div class="grp ${gated?'gated':''}"><h3>${g.g}${gated?'<small>需先符合適用前提</small>':''}</h3>${
    fs.map(f=>{
      if(f.type==='grid') return `<p class="muted" style="margin:0 0 6px">${f.label}</p><div class="grid9">${
        f.opts.map(o=>`<button type="button" data-grid="${f.id}" data-v="${o}" aria-pressed="${val(f.id)===o}">${f.labels[o]}</button>`).join('')}</div>`;
      return `<div class="row"><span class="lab">${f.label}${f.hint?`<span class="hint">${f.hint}</span>`:''}</span>${inputHTML(f)}</div>`;
    }).join('')}</div>`;
}
function renderInputs(){
  const all=fieldsOf(C);
  // 病人列
  $('strip').innerHTML=STRIP.map(id=>all.find(([g,f])=>f.id===id)).filter(Boolean).filter(([g,f])=>shown(f))
    .map(([g,f])=>`<label>${f.label}${f.unit?` <span style="opacity:.7">${f.unit}</span>`:''}${inputHTML(f,true)}</label>`).join('');
  // 計算值：缺任一所需數值即不計算，並明示缺什麼
  const sh=(C.shows||[]).map(s=>{let txt;try{txt=s.fmt(DER[s.k]===undefined?null:DER[s.k],DER);}catch(e){txt='—';}
    return `<span>${s.label}：<b>${esc(txt)}</b></span>`;}).join('');
  $('derived').innerHTML=sh; $('derived').hidden=!sh;
  const core=C.groups.filter(isCore), more=C.groups.filter(g=>!isCore(g));
  $('core').innerHTML=core.map(groupHTML).join('');
  $('more').innerHTML=more.map(groupHTML).join('')||'<p class="muted">無其他欄位。</p>';
  document.querySelectorAll('[data-tri]').forEach(box=>box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    F[box.dataset.tri]=b.dataset.v==='null'?null:b.dataset.v==='true';update();}));
  document.querySelectorAll('[data-choice]').forEach(box=>box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    F[box.dataset.choice]=b.dataset.v===''?null:b.dataset.v;update();}));
  document.querySelectorAll('[data-grid]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.grid;F[k]=F[k]===b.dataset.v?null:b.dataset.v;update();});
  document.querySelectorAll('[data-f]').forEach(el=>{
    const ev=el.tagName==='SELECT'?'change':'input';
    el.addEventListener(ev,()=>{
      const k=el.dataset.f,raw=el.value.trim();
      F[k]= raw===''?null : el.dataset.num ? (isNaN(parseFloat(raw))?null:parseFloat(raw)) : raw;
      update(el.dataset.f);
    });
  });
}

/* ---------- 警示 ---------- */
function renderAlerts(){
  const hits=(C.redflags||[]).filter(r=>{try{return r.if(facts());}catch(e){return false;}});
  const ok=hits.filter(r=>refsOK(r.refs)), blocked=hits.length-ok.length;
  if(!ok.length){
    $('alerts').innerHTML=`<div class="alert calm"><strong>先看病人，再看流程。</strong> 目前未觸發警示，不代表安全；請持續再評估。${
      blocked?`<div class="muted">另有 ${blocked} 項提示因引用未查證而封鎖。</div>`:''}</div>`;
    return;
  }
  $('alerts').innerHTML=`<div class="alert"><strong>優先處理</strong><ul>${
    ok.map(r=>`<li>${r.msg} ${whyBtn(r.refs)}</li>`).join('')}</ul>${
    blocked?`<div class="muted">另有 ${blocked} 項提示因引用未查證而封鎖。</div>`:''}</div>`;
  bindWhy($('alerts'));
}

/* ---------- 三組 ---------- */
/* 動向：僅在引用已查證時顯示 */
function dispoKind(d){
  const p=d.dispo; if(!p||!refsOK(p.refs)) return null;
  const a=(p.admit||[]).length, h=(p.home||[]).length;
  if(a&&h) return ['cond','依條件分流'];
  if(a) return ['adm','建議住院／處置'];
  if(h) return ['home','可評估返家'];
  return null;
}
function dispoHTML(d){
  const p=d.dispo;
  if(!p) return '<p class="muted">目前沒有已查證之動向依據，請依院內規範與臨床判斷。</p>';
  if(!refsOK(p.refs)) return '<p class="muted">動向依據尚未查證。</p>';
  const sec=(cls,title,arr)=>arr&&arr.length?`<div class="dsec ${cls}"><h3>${title}</h3><ul>${arr.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'';
  return sec('adm','住院、留觀或緊急處置',p.admit)+sec('home','可評估返家，安排門診追蹤',p.home)
    +sec('cond','需調整處置的條件',p.caution)+`<div style="margin-top:8px">${whyBtn(p.refs)}</div>`
    +'<p class="muted" style="margin-top:10px">動向最終由主治醫師依病人整體狀況、共病、社會支持與院內資源決定。返家者須給予返診警訊衛教。</p>';
}
function card(x,bucket){
  const {d,e}=x, t=TAG[d.id];
  const pills=[];
  if(bucket===1&&x.kind==='fit') pills.push('<span class="pill fit">資料支持</span>');
  if(bucket===1&&x.kind==='common') pills.push('<span class="pill common">常見</span>');
  if(bucket!==2&&d.danger) pills.push('<span class="pill" style="color:var(--red)">危險</span>');
  if(t) pills.push(`<span class="pill tag">${({keep:'持續考慮',less:'暫不支持',more:'需補資料'})[t]}</span>`);
  const dk=dispoKind(d); if(dk) pills.push(`<span class="pill ${dk[0]}">${dk[1]}</span>`);
  const sub = bucket===1&&x.kind==='common'
      ? `${d.common.note}（尚待資料支持）`
      : (e.support.length? '支持：'+e.support.slice(0,2).join('、') : (e.missing.length?'尚缺：'+e.missing.slice(0,2).join('、'):''));
  const hit=e.decisive||e.strong>=2||(bucket===2&&e.strong>0);
  return `<button class="card ${hit?'hit':''}" data-dx="${d.id}">
    <span class="t"><span>${d.name}</span><span>${pills.join(' ')}</span></span>
    <span class="meta"><span class="s">支持 ${e.support.length}</span><span class="a">不符 ${e.against.length}</span><span class="m">尚缺 ${e.missing.length}</span></span>
    ${sub?`<span class="why1">${esc(sub)}</span>`:''}</button>`;
}
function renderBuckets(){
  const [A,B,Cc]=buckets();
  const hasData=Object.values(F).some(v=>v!==null);
  $('buckets').innerHTML=`
  <div class="bucket b1"><header><h2><span class="num">1</span>最符合／最常見</h2>
    <p class="q">目前資料最能解釋者；資料不足時列出最常見病因</p></header>
    ${A.length?A.map(x=>card(x,1)).join(''):`<p class="empty">${hasData?'目前沒有足以支持的診斷，請補充資料。':'輸入資料後顯示。'}</p>`}</div>
  <div class="bucket b2"><header><h2><span class="num">2</span>最嚴重・不能漏</h2>
    <p class="q">即使不最像，漏掉的後果仍嚴重</p></header>
    ${B.map(x=>card(x,2)).join('')||'<p class="empty">無。</p>'}</div>
  <div class="bucket b3"><header><h2><span class="num">3</span>其他鑑別</h2>
    <p class="q">替代解釋；依病史與後續結果展開</p></header>
    ${Cc.length?Cc.map(x=>card(x,3)).join(''):'<p class="empty">無。</p>'}</div>`;
  $('buckets').querySelectorAll('[data-dx]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.dx));
  const flagged=B.filter(x=>x.e.decisive||x.e.strong>0).length;
  $('jump').innerHTML=`<span>最符合 <b>${A.length}</b></span><span class="r">危險 <b>${flagged}</b>/${B.length}</span>`
    +`<span>其他 <b>${Cc.length}</b></span><span class="go">看鑑別 ↓</span>`;
}

/* ---------- 詳情抽屜 ---------- */
function openDrawer(id){OPEN=id;DTAB='why';renderDrawer();
  $('drawer').classList.add('on');$('scrim').classList.add('on');$('drawer').setAttribute('aria-hidden','false');
  setTimeout(()=>{const c=$('drawer').querySelector('.dclose');if(c)c.focus();},50);}
function closeDrawer(){OPEN=null;$('drawer').classList.remove('on');$('scrim').classList.remove('on');$('drawer').setAttribute('aria-hidden','true');}
function renderDrawer(){
  if(!OPEN) return;
  const d=C.dx.find(x=>x.id===OPEN); if(!d){closeDrawer();return;}
  const e=evalDx(d), t=TAG[d.id]||'';
  const tabs=[['why','為什麼考慮'],['ask','還要問什麼'],['test','檢查'],['re','結果回來後'],['dispo','動向']];
  let body='';
  if(DTAB==='why'){
    body=`<p style="margin-top:0">${d.why}</p>`
      +(d.common&&refOK(d.common.ref)?`<p class="muted">常見度：${d.common.note} ${whyBtn([d.common.ref])}</p>`:'')
      +(e.support.length?`<h2 class="s" style="font-size:14px">支持線索</h2><ul class="lst s">${e.support.map(s=>`<li>${s}</li>`).join('')}</ul>`:'')
      +(e.against.length?`<h2 class="a" style="font-size:14px">不符合之處</h2><ul class="lst a">${e.against.map(s=>`<li>${s}</li>`).join('')}</ul>`:'')
      +(e.missing.length?`<h2 class="m" style="font-size:14px">尚缺資訊</h2><ul class="lst m">${e.missing.map(s=>`<li>${s}</li>`).join('')}</ul>`:'');
  }else if(DTAB==='ask'){
    const ok=(d.ask||[]).filter(a=>refsOK(a.refs)),nb=(d.ask||[]).length-ok.length;
    body=(ok.map(a=>`<div class="item"><b>${a.q}</b><p>${a.why}</p>${whyBtn(a.refs)}</div>`).join('')||'<p class="muted">無已查證之追問項目。</p>')
      +(nb?`<p class="muted">另有 ${nb} 項因引用未查證而封鎖。</p>`:'');
  }else if(DTAB==='test'){
    const ok=(d.tests||[]).filter(x=>refsOK(x.refs)),nb=(d.tests||[]).length-ok.length;
    const Y={high:'高產出',mid:'視情況',low:'對此目的低產出'};
    body=(ok.map(x=>`<div class="item"><b>${x.t}<span class="yield y-${x.yield||'mid'}">${Y[x.yield||'mid']}</span></b>
      <p>目的：${x.purpose}</p>${x.note?`<p>${x.note}</p>`:''}${x.caveat?`<p class="cav">注意：${x.caveat}</p>`:''}${whyBtn(x.refs)}</div>`).join('')
      ||'<p class="muted">無已查證之檢查項目。</p>')+(nb?`<p class="muted">另有 ${nb} 項因引用未查證而封鎖。</p>`:'');
  }else if(DTAB==='dispo'){
    body=dispoHTML(d);
  }else{
    body=`<p style="margin-top:0">${d.reassess||'—'}</p>`;
  }
  const keeps=Object.entries(TAG).filter(([k,v])=>v==='keep').length;
  $('drawer').innerHTML=`<div class="dhead">
      <button class="dclose" aria-label="關閉">✕</button>
      <div class="eyebrow">${C.name}${d.danger?'・<span style="color:var(--red)">危險診斷</span>':''}</div>
      <h2>${d.name}</h2>
      <div class="muted">支持 ${e.support.length}・不符 ${e.against.length}・尚缺 ${e.missing.length}　工作診斷，尚非確診</div>
      <div class="tagrow">${[['keep','持續考慮'],['less','暫時較不支持'],['more','需補資料']].map(([k,l])=>
        `<button data-tag="${k}" aria-pressed="${t===k}">${l}</button>`).join('')}</div>
      ${keeps>=2?'<div class="callout">已標記多個「持續考慮」：各診斷的處置不能直接合併，先釐清互相衝突的條件。</div>':''}
      <div class="dtabs">${tabs.map(([k,l])=>`<button data-dtab="${k}" aria-selected="${DTAB===k}">${l}</button>`).join('')}</div>
    </div><div class="dbody">${body}</div>`;
  $('drawer').querySelector('.dclose').onclick=closeDrawer;
  $('drawer').querySelectorAll('[data-dtab]').forEach(b=>b.onclick=()=>{DTAB=b.dataset.dtab;renderDrawer();});
  $('drawer').querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{
    TAG[OPEN]=TAG[OPEN]===b.dataset.tag?'':b.dataset.tag;renderDrawer();renderBuckets();});
  bindWhy($('drawer'));
}

/* ---------- 引用完整性 ---------- */
function renderInteg(){
  const rows=auditAll(), ok=rows.filter(r=>r.ok).length, pct=Math.round(ok/rows.length*100);
  $('integ').innerHTML=`<div class="eyebrow">引用完整性</div>
    <div style="margin-top:4px"><b>${ok}</b> / ${rows.length} 條主張已查證・<b style="color:var(--red)">${rows.length-ok}</b> 條封鎖</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="muted">引用庫 ${Object.keys(REFS).length} 筆・最後查證 ${EVIDENCE_REVIEWED}</div>
    <button class="linkbtn" id="auditbtn">稽核明細</button><div id="audit"></div>`;
  $('auditbtn').onclick=()=>{
    const w=$('audit'); if(w.innerHTML){w.innerHTML='';return;}
    w.innerHTML=`<table class="audit"><tr><th>主張</th><th>引用</th><th>狀態</th></tr>${
      rows.map(r=>`<tr><td>${esc(r.path)}</td><td>${esc(r.id)}</td><td style="color:${r.ok?'var(--teal-ink)':'var(--red)'}">${r.ok?'已查證':'封鎖'}</td></tr>`).join('')}</table>`;
  };
}

/* ---------- 主流程 ---------- */
function update(focusId){
  derive(); renderInputs(); renderAlerts(); renderBuckets(); if(OPEN) renderDrawer();
  if(focusId){const el=document.querySelector(`[data-f="${focusId}"]`);
    if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}}}
}
function load(key){
  if(!COMPLAINTS[key]) key='abdo';
  KEY=key; C=COMPLAINTS[key]; F={}; TAG={}; closeDrawer();
  fieldsOf(C).forEach(([g,f])=>F[f.id]=null);
  $('ceyebrow').textContent=`${C.name}・主訴導航`;
  $('ctitle').textContent=C.tagline;
  $('cprimer').textContent=C.primer;
  $('flowlink').hidden=key!=='dizzy';
  $('tabs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===key));
  if(location.hash!=='#'+key) history.replaceState(null,'','#'+key);
  update(); window.scrollTo({top:0});
}
$('tabs').innerHTML=Object.entries(COMPLAINTS).map(([k,c])=>`<button role="tab" data-k="${k}">${SHORT[k]||c.name}</button>`).join('');
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>load(b.dataset.k));
$('reset').onclick=()=>load(KEY);
$('scrim').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
window.addEventListener('hashchange',()=>load(location.hash.slice(1)));
$('theme').onclick=()=>{
  const r=document.documentElement, dark=matchMedia('(prefers-color-scheme: dark)').matches;
  const cur=r.dataset.theme||(dark?'dark':'light'); r.dataset.theme=cur==='dark'?'light':'dark';
  try{localStorage.setItem('edtheme',r.dataset.theme);}catch(e){}
};
try{const t=localStorage.getItem('edtheme'); if(t) document.documentElement.dataset.theme=t;}catch(e){}
if(matchMedia('(max-width:900px)').matches) $('moredet').open=false;
$('jump').onclick=()=>$('buckets').scrollIntoView({behavior:'smooth',block:'start'});
// 鑑別區已在畫面內時隱藏摘要列，避免遮住卡片
if('IntersectionObserver' in window){
  new IntersectionObserver(es=>es.forEach(e=>$('jump').classList.toggle('off',e.isIntersecting)),{threshold:0.05})
    .observe($('buckets'));
}
renderInteg();
load((location.hash||'#abdo').slice(1));
</script>
